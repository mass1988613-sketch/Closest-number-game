
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الرقم الأقرب</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,Tahoma,sans-serif;background:#101528;color:white;margin:0}
main{max-width:960px;margin:auto;padding:22px}
.card{background:#1c2540;border:1px solid #33415d;border-radius:20px;padding:22px;margin:16px 0}
h1{font-size:clamp(32px,6vw,62px);margin:10px 0;color:#facc15}
h2{font-size:clamp(22px,4vw,36px)}
input,textarea,button{font:inherit;border-radius:12px;padding:12px;margin:5px 0}
input,textarea{width:100%;background:#0f172a;color:white;border:1px solid #64748b}
button{background:#facc15;color:#111827;border:0;font-weight:bold;cursor:pointer;margin-left:8px}
button.secondary{background:#334155;color:white}
.hidden{display:none!important}
.big{font-size:clamp(32px,8vw,80px);font-weight:800}
.muted{color:#b6c2d6}
.score{display:flex;justify-content:space-between;gap:15px;padding:12px;border-bottom:1px solid #334155}
#question{font-size:clamp(28px,5vw,52px)}
#error{color:#fb7185;text-align:center}
.center{text-align:center}
label{display:block;margin-top:12px}
small{color:#cbd5e1}
.tv-mode main{max-width:none;padding:2vw}
.tv-mode h1{font-size:5vw}
.tv-mode #question{font-size:5vw}
.tv-mode #clock{font-size:4vw}
.tv-mode #code{font-size:4vw}
.tv-mode #scores{font-size:2.5vw}
.tv-mode #results{font-size:2.5vw}
.tv-mode .card{margin:1vw 0;padding:2vw}
</style>
</head>
<body>
<main>
<div class="center">
<h1>🎯 الرقم الأقرب</h1>
<p class="muted">جاوب برقم... واجمع أكبر عدد من النقاط!</p>
</div>

<div id="error"></div>

<section id="home" class="card">
<h2>ابدأ اللعب</h2>
<button onclick="create()">🎤 إنشاء غرفة كمضيف</button>

<h3>📺 شاشة التلفزيون</h3>
<input id="tvCode" placeholder="رمز الغرفة (6 أرقام)" inputmode="numeric">
<button class="secondary" onclick="watch()">عرض الغرفة على التلفزيون</button>

<h3>أو انضم كلاعب</h3>
<input id="joinCode" placeholder="رمز الغرفة (6 أرقام)" inputmode="numeric">
<input id="name" placeholder="اسم اللاعب" maxlength="24">
<button onclick="join()">دخول الغرفة</button>
</section>

<section id="game" class="hidden">
<div class="card center">
<div class="muted">رمز الغرفة</div>
<div id="code" class="big"></div>
<small>افتح رابط اللعبة على الأجهزة الأخرى وأدخل رمز الغرفة</small>
<p id="round"></p>
<div id="question"></div>
<div id="clock" class="big"></div>
</div>

<div id="hostPanel" class="card hidden">
<h2>🎤 لوحة المضيف</h2>
<label>السؤال</label>
<textarea id="newQuestion" rows="2" placeholder="اكتب السؤال هنا"></textarea>
<label>الإجابة الصحيحة (رقم)</label>
<input id="correct" type="number" step="any" placeholder="الإجابة الرقمية">
<label>المدة بالثواني</label>
<input id="duration" type="number" value="30" min="10" max="180">
<button onclick="start()">عرض السؤال وبدء الوقت</button>
<button class="secondary" onclick="socket.emit('finish')">إنهاء السؤال وكشف النتائج</button>
</div>

<div id="playerPanel" class="card hidden">
<h2>📱 إجابتك</h2>
<input id="guess" type="number" step="any" placeholder="اكتب الرقم هنا">
<button id="submit" onclick="answer()">تأكيد الإجابة</button>
<p id="answerStatus"></p>
</div>

<div id="results" class="card hidden">
<h2>🏆 نتائج الجولة</h2>
<div id="correctAnswer"></div>
<div id="resultRows"></div>
</div>

<div class="card">
<h2>📊 ترتيب اللاعبين</h2>
<div id="scores"></div>
</div>

<div class="card muted">
النقاط: صحيح تمامًا 10 | ضمن ±5% = 7 | ضمن ±10% = 3 | غير ذلك = 0
</div>
</section>
</main>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();
const $=id=>document.getElementById(id);
let role='',myId='',lastRound=0,room='';

function err(s){$('error').textContent=s||'';}

function showGame(){
document.body.classList.toggle('tv-mode',role==='tv');
$('home').classList.add('hidden');
$('game').classList.remove('hidden');
$('hostPanel').classList.toggle('hidden',role!=='host');
$('playerPanel').classList.toggle('hidden',role!=='player');
}

function create(){
socket.emit('create',{},r=>{
if(r.error)return err(r.error);
role='host';room=r.code;
sessionStorage.removeItem('tv');
sessionStorage.removeItem('player');
sessionStorage.setItem('host',JSON.stringify({code:room,key:r.hostKey}));
err('');
showGame();
});
}

function watch(){
const code=$('tvCode').value.trim();
if(!/^\d{6}$/.test(code))return err('أدخل رمز الغرفة المكون من 6 أرقام');
socket.emit('watch',{code},r=>{
if(r.error)return err(r.error);
role='tv';room=code;
sessionStorage.removeItem('host');
sessionStorage.removeItem('player');
sessionStorage.setItem('tv',code);
err('');
showGame();
});
}

function join(){
const code=$('joinCode').value.trim();
const name=$('name').value.trim();
socket.emit('join',{code,name},r=>{
if(r.error)return err(r.error);
role='player';room=code;myId=r.id;
sessionStorage.removeItem('tv');
sessionStorage.removeItem('host');
sessionStorage.setItem('player',JSON.stringify({code,name,id:myId}));
err('');
showGame();
});
}

function start(){
const question=$('newQuestion').value;
const raw=$('correct').value;
if(!question.trim()||raw.trim()==='')return err('أدخل السؤال والإجابة');
socket.emit('start',{
question,
answer:Number(raw),
seconds:Number($('duration').value)
},r=>err(r.error));
}

function answer(){
const raw=$('guess').value;
if(raw.trim()==='')return err('اكتب رقمًا');
socket.emit('answer',{value:raw},r=>{
if(r.error)return err(r.error);
$('answerStatus').textContent='تم إرسال إجابتك ✅';
$('submit').disabled=true;
});
}

function esc(v){
return String(v).replace(/[&<>"']/g,c=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[c]));
}

socket.on('state',s=>{
if(s.code!==room)return;
showGame();
$('code').textContent=s.code;
$('round').textContent='الجولة '+s.round;
$('question').textContent=s.question||'بانتظار السؤال التالي';
$('clock').textContent=s.phase==='question'?'⏱ '+s.seconds+' ثانية':'';

if(s.round!==lastRound){
lastRound=s.round;
$('guess').value='';
$('submit').disabled=false;
$('answerStatus').textContent='';
}

if(role==='player'){
$('playerPanel').classList.toggle('hidden',s.phase!=='question');
const p=s.players.find(p=>p.name===sessionPlayerName());
if(p&&p.answered){
$('submit').disabled=true;
$('answerStatus').textContent='تم تسجيل إجابتك ✅';
}
}

$('scores').innerHTML=[...s.players]
.sort((a,b)=>b.score-a.score)
.map((p,i)=>'<div class="score"><span>'+(i+1)+'. '+esc(p.name)+(p.answered?' ✅':'')+'</span><strong>'+p.score+' نقطة</strong></div>')
.join('')||'بانتظار اللاعبين...';

$('results').classList.toggle('hidden',s.phase!=='results');

if(s.phase==='results'){
$('correctAnswer').textContent='الإجابة الصحيحة: '+s.correctAnswer;
$('resultRows').innerHTML=(s.results||[]).map(p=>
'<div class="score"><span>'+esc(p.name)+' — '+(p.answer===null?'لم يجب':esc(p.answer))+'</span><strong>+'+p.points+' نقاط</strong></div>'
).join('');
}
});

function sessionPlayerName(){
try{return JSON.parse(sessionStorage.getItem('player')).name}
catch{return ''}
}

socket.on('connect',()=>{
try{
const h=JSON.parse(sessionStorage.getItem('host')||'null');
const p=JSON.parse(sessionStorage.getItem('player')||'null');
const tv=sessionStorage.getItem('tv');

if(h){
socket.emit('reconnectHost',h,r=>{
if(r.ok){role='host';room=h.code;showGame();}
else{sessionStorage.removeItem('host');err(r.error);}
});
}else if(tv){
socket.emit('watch',{code:tv},r=>{
if(r.ok){role='tv';room=tv;err('');showGame();}
else{sessionStorage.removeItem('tv');err(r.error);}
});
}else if(p){
socket.emit('join',p,r=>{
if(r.ok){role='player';room=p.code;myId=r.id;showGame();}
else{sessionStorage.removeItem('player');err(r.error);}
});
}
}catch(e){err('تعذر استعادة الاتصال');}
});
</script>

<style>
/* شاشة تلفزيون كاملة */
.tv-mode {
  height:100vh;
  height:100dvh;
  overflow:hidden;
}
.tv-mode main {
  max-width:none;
  width:100%;
  height:100vh;
  height:100dvh;
  padding:1.2vh 1.3vw;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.tv-mode main>.center {display:none}
.tv-mode #game {
  flex:1;
  min-height:0;
  display:grid;
  direction:ltr;
  grid-template-columns:minmax(0,1fr) minmax(0,2.1fr) minmax(0,1fr);
  grid-template-rows:minmax(0,1fr);
  gap:1vw;
}
.tv-mode #game>.card {
  margin:0;
  min-width:0;
  min-height:0;
  overflow:hidden;
}
.tv-mode #game>.card:first-child {
  grid-column:2;
  grid-row:1;
  direction:rtl;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:2vw;
  background:linear-gradient(145deg,#20365c,#131d34);
}
.tv-mode #game>.card:first-child .muted {
  font-size:1.4vw;
}
.tv-mode #code {
  font-size:3vw;
  color:#facc15;
}
.tv-mode #game>.card:first-child small {display:none}
.tv-mode #round {
  font-size:1.5vw;
  margin:1vh 0;
}
.tv-mode #question {
  font-size:clamp(20px,3.5vw,70px);
  font-weight:800;
  line-height:1.4;
  text-align:center;
  overflow-wrap:anywhere;
  max-height:55%;
  overflow:hidden;
}
.tv-mode #clock {
  font-size:5vw;
  color:#facc15;
  margin-top:2vh;
}
.tv-mode #hostPanel,
.tv-mode #playerPanel,
.tv-mode #game>.card:last-child {
  display:none!important;
}
.tv-mode #results {
  grid-column:3;
  grid-row:1;
  direction:rtl;
  display:flex!important;
  flex-direction:column;
  padding:1.2vw;
}
.tv-mode #results.hidden #correctAnswer,
.tv-mode #results.hidden #resultRows {
  display:none;
}
.tv-mode #results:not(.hidden) #tvAnswers {
  display:none;
}
.tv-mode #game>.card:nth-last-child(2) {
  grid-column:1;
  grid-row:1;
  direction:rtl;
  display:flex;
  flex-direction:column;
  padding:1.2vw;
}
.tv-mode #results h2,
.tv-mode #game>.card:nth-last-child(2) h2 {
  font-size:1.9vw;
  color:#facc15;
  text-align:center;
  margin:0 0 1vh;
}
.tv-mode #scores,
.tv-mode #resultRows,
.tv-mode #tvAnswers {
  overflow:auto;
  min-height:0;
  scrollbar-width:none;
}
.tv-mode .score {
  font-size:1.35vw;
  padding:1vh .3vw;
  gap:.5vw;
  overflow-wrap:anywhere;
}
.tv-mode .score strong {
  white-space:nowrap;
  color:#facc15;
}
.tv-mode #correctAnswer {
  font-size:1.5vw;
  color:#4ade80;
  text-align:center;
}
#tvSound {
  display:none;
}
.tv-mode #tvSound {
  display:block;
  position:fixed;
  top:1vh;
  right:1vw;
  z-index:100;
  font-size:1vw;
  padding:.5vw 1vw;
  opacity:.9;
}
@media(max-height:550px) {
  .tv-mode .score {padding:.5vh .2vw}
  .tv-mode #clock {margin-top:1vh}
}
</style>

<button id="tvSound" class="secondary" onclick="toggleTvSound()">
🔊 تشغيل الموسيقى
</button>

<script>
let tvAudio=null;
let tvSoundOn=false;
let tvMusicTimer=null;
let tvLastPhase='';
let tvLastSeconds=null;

function audioContext(){
  if(!tvAudio){
    tvAudio=new (window.AudioContext||window.webkitAudioContext)();
  }
  return tvAudio;
}

function tone(freq,duration,volume=0.015,type='sine'){
  if(!tvSoundOn)return;
  const ctx=audioContext();
  if(ctx.state==='suspended')ctx.resume();
  const oscillator=ctx.createOscillator();
  const gain=ctx.createGain();
  oscillator.type=type;
  oscillator.frequency.value=freq;
  gain.gain.setValueAtTime(0.0001,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(
    volume,ctx.currentTime+0.08
  );
  gain.gain.exponentialRampToValueAtTime(
    0.0001,ctx.currentTime+duration
  );
  oscillator.connect(gain);
  gain.connect(ctx.destination);
  oscillator.start();
  oscillator.stop(ctx.currentTime+duration+0.02);
}

let noteIndex=0;
const melody=[220,261.63,293.66,261.63,196,246.94,261.63,220];

function playMusic(){
  if(tvMusicTimer||!tvSoundOn)return;
  tone(melody[noteIndex++%melody.length],1.7,0.012);
  tvMusicTimer=setInterval(()=>{
    tone(melody[noteIndex++%melody.length],1.7,0.012);
  },1900);
}

function stopMusic(){
  if(tvMusicTimer){
    clearInterval(tvMusicTimer);
    tvMusicTimer=null;
  }
}

function toggleTvSound(){
  tvSoundOn=!tvSoundOn;
  const btn=document.getElementById('tvSound');
  btn.textContent=tvSoundOn?'🔇 كتم الموسيقى':'🔊 تشغيل الموسيقى';
  if(tvSoundOn){
    audioContext().resume();
    if(tvLastPhase==='question')playMusic();
  }else{
    stopMusic();
  }
}

socket.on('state',s=>{
  if(role!=='tv'||s.code!==room)return;

  let panel=document.getElementById('tvAnswers');
  if(!panel){
    panel=document.createElement('div');
    panel.id='tvAnswers';
    document.getElementById('results').appendChild(panel);
  }

  const finished=s.phase==='results';
  const heading=document.querySelector('#results h2');
  heading.textContent=finished?'📝 نتائج الإجابات':'📝 إجابات اللاعبين';

  panel.innerHTML=s.players.map(p=>
    '<div class="score"><span>'+esc(p.name)+
    '</span><strong>'+(p.answered?'✅ أجاب':'⏳ ينتظر')+
    '</strong></div>'
  ).join('')||'بانتظار اللاعبين...';

  if(s.phase==='question'){
    if(tvLastPhase!=='question')playMusic();
    if(s.seconds<=5 && s.seconds>0 &&
       s.seconds!==tvLastSeconds){
      tone(660,0.14,0.045);
    }
  }else{
    stopMusic();
    if(finished && tvLastPhase==='question'){
      tone(523.25,0.4,0.035);
      setTimeout(()=>tone(659.25,0.5,0.035),180);
    }
  }

  tvLastPhase=s.phase;
  tvLastSeconds=s.seconds;
});
</script>

</body>
</html>
