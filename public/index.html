<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الرقم الأقرب</title><style>body{font-family:system-ui,Tahoma,sans-serif;background:#101528;color:#fff;margin:0}main{max-width:960px;margin:auto;padding:22px}.card{background:#1c2540;border:1px solid #33415d;border-radius:20px;padding:22px;margin:16px 0}h1{font-size:clamp(32px,6vw,62px);margin:10px 0;color:#facc15}h2{font-size:clamp(22px,4vw,36px)}input,textarea,button{font:inherit;border-radius:12px;padding:12px;margin:5px 0;box-sizing:border-box}input,textarea{width:100%;background:#0f172a;color:white;border:1px solid #64748b}button{background:#facc15;color:#111827;border:0;font-weight:bold;cursor:pointer;margin-left:8px}button.secondary{background:#334155;color:#fff}.hidden{display:none}.big{font-size:clamp(32px,8vw,80px);font-weight:800}.muted{color:#b6c2d6}.row{display:flex;gap:12px;flex-wrap:wrap}.pill{background:#334155;padding:8px 12px;border-radius:12px}.score{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #334155}#error{color:#fb7185}#question{font-size:clamp(28px,5vw,52px)}.center{text-align:center}label{display:block;margin-top:12px}small{color:#cbd5e1}</style></head><body><main><div class="center"><h1>🎯 الرقم الأقرب</h1><p class="muted">جاوب برقم... واجمع أكبر عدد من النقاط!</p></div><div id="error"></div><section id="home" class="card"><h2>ابدأ اللعب</h2><button onclick="create()">🎤 إنشاء غرفة كمضيف</button><h3>أو انضم كلاعب</h3><input id="joinCode" placeholder="رمز الغرفة (6 أرقام)" inputmode="numeric"><input id="name" placeholder="اسم اللاعب" maxlength="24"><button onclick="join()">دخول الغرفة</button></section><section id="game" class="hidden"><div class="card center"><div class="muted">رمز الغرفة</div><div id="code" class="big"></div><small>افتح نفس رابط الموقع على جوالات اللاعبين وأدخل رمز الغرفة</small><p id="round"></p><div id="question"></div><div id="clock" class="big"></div></div><div id="hostPanel" class="card hidden"><h2>🎤 لوحة المضيف</h2><label>السؤال</label><textarea id="newQuestion" rows="2" placeholder="مثال: كم يبلغ طول نهر النيل بالكيلومتر؟"></textarea><label>الإجابة الصحيحة (رقم)</label><input id="correct" type="number" step="any" placeholder="مثال: 6650"><label>المدة بالثواني</label><input id="duration" type="number" value="30" min="10" max="180"><button onclick="start()">عرض السؤال وبدء الوقت</button><button class="secondary" onclick="socket.emit('finish')">إنهاء السؤال وكشف النتائج</button></div><div id="playerPanel" class="card hidden"><h2>📱 إجابتك</h2><input id="guess" type="number" step="any" placeholder="اكتب الرقم هنا"><button id="submit" onclick="answer()">تأكيد الإجابة</button><p id="answerStatus"></p></div><div id="results" class="card hidden"><h2>🏆 نتائج الجولة</h2><div id="correctAnswer"></div><div id="resultRows"></div></div><div class="card"><h2>📊 ترتيب اللاعبين</h2><div id="scores"></div></div><div class="card muted">النقاط: صحيح تماماً 10 | ضمن ±5% = 7 | ضمن ±10% = 3 | غير ذلك = 0</div></section></main><script src="/socket.io/socket.io.js"></script><script>
const socket=io(),$=id=>document.getElementById(id);let role='',myId='',lastRound=0,room='',reveal=null;function err(s){$('error').textContent=s||'';}function showGame(){ $('home').classList.add('hidden');$('game').classList.remove('hidden');$('hostPanel').classList.toggle('hidden',role!=='host');$('playerPanel').classList.toggle('hidden',role!=='player');}function create(){socket.emit('create',{},r=>{if(r.error)return err(r.error);role='host';room=r.code;sessionStorage.setItem('host',JSON.stringify({code:room,key:r.hostKey}));showGame();});}function join(){const code=$('joinCode').value.trim(),name=$('name').value.trim();socket.emit('join',{code,name},r=>{if(r.error)return err(r.error);role='player';room=code;myId=r.id;sessionStorage.setItem('player',JSON.stringify({code,name,id:myId}));showGame();});}function start(){const question=$('newQuestion').value,raw=$('correct').value;if(!question.trim()||raw.trim()==='')return err('أدخل السؤال والإجابة');socket.emit('start',{question,answer:Number(raw),seconds:Number($('duration').value)},r=>err(r.error));}function answer(){const raw=$('guess').value;if(raw.trim()==='')return err('اكتب رقماً');socket.emit('answer',{value:raw},r=>{if(r.error)return err(r.error);$('answerStatus').textContent='تم إرسال إجابتك ✅';$('submit').disabled=true;});}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}socket.on('state',s=>{if(s.code!==room)return;showGame();$('code').textContent=s.code;$('round').textContent='الجولة '+s.round;$('question').textContent=s.question||'بانتظار السؤال التالي';$('clock').textContent=s.phase==='question'?'⏱ '+s.seconds+' ثانية':'';if(s.round!==lastRound){lastRound=s.round;reveal=null;$('guess').value='';$('submit').disabled=false;$('answerStatus').textContent='';}if(role==='player'){$('playerPanel').classList.toggle('hidden',s.phase!=='question');if(s.players.find(p=>p.name===sessionPlayerName())?.answered){$('submit').disabled=true;$('answerStatus').textContent='تم تسجيل إجابتك ✅';}}$('scores').innerHTML=[...s.players].sort((a,b)=>b.score-a.score).map((p,i)=>`<div class="score"><span>${i+1}. ${esc(p.name)} ${p.answered?'✅':''}</span><strong>${p.score} نقطة</strong></div>`).join('')||'بانتظار اللاعبين...';$('results').classList.toggle('hidden',s.phase!=='results');if(s.phase==='results'){$('correctAnswer').textContent=reveal===null?'الإجابة الصحيحة ستظهر الآن':'الإجابة الصحيحة: '+reveal;$('resultRows').innerHTML=s.results.map(p=>`<div class="score"><span>${esc(p.name)} — ${p.answer===null?'لم يجب':esc(p.answer)}</span><strong>+${p.points} نقاط</strong></div>`).join('');}});function sessionPlayerName(){try{return JSON.parse(sessionStorage.getItem('player')).name}catch{return ''}}socket.on('reveal',r=>{reveal=r.answer;$('correctAnswer').textContent='الإجابة الصحيحة: '+reveal;});socket.on('connect',()=>{try{let h=JSON.parse(sessionStorage.getItem('host')||'null'),p=JSON.parse(sessionStorage.getItem('player')||'null');if(h){socket.emit('reconnectHost',h,r=>{if(r.ok){role='host';room=h.code;showGame();}else sessionStorage.removeItem('host');});}else if(p){socket.emit('join',p,r=>{if(r.ok){role='player';room=p.code;myId=r.id;showGame();}else sessionStorage.removeItem('player');});}}catch{}});
</script></body></html>
